syntax = "proto3";

package dblib;

// One row per measured operation. Every git-like verb (branch, commit, ...)
// produces one row. exec() produces a CONNECT row per branch switch, one row
// per SQL statement the script ran (READ/INSERT/UPDATE/DDL), and one EXEC row
// summarising the whole script run on that ref.
message Result {
  // Unique identifier for the run
  string run_id = 1;

  // Random seed used for the run
  int32 random_seed = 2;

  // Incremental row number within the run
  int32 iteration_number = 3;

  // Type of database operation being benchmarked
  OpType op_type = 4;

  // Whether the backend ran the operation, could not (UNSUPPORTED), or
  // tried and errored (FAILED).
  OpStatus status = 5;

  // Branch (or "branch@commit") the operation targeted. For EXEC rows in
  // multi-ref mode this is the primary ref; the others are in `refs`.
  string ref = 6;
  repeated string refs = 7;

  // Free-form label passed by the driver (e.g. the workflow phase).
  string label = 8;

  // Groups the CONNECT, statement and EXEC rows of one exec() call.
  int32 exec_id = 9;

  // Name of the table being operated on (driver context)
  string table_name = 10;

  // Schema of the table (driver context)
  string table_schema = 11;

  // Initial size of the database in bytes (driver context)
  int64 initial_db_size = 12;

  // Number of keys touched during the operation
  int64 num_keys_touched = 13;

  // Latency in seconds. 0 for UNSUPPORTED rows.
  double latency = 14;

  // Storage used before/after the operation (bytes), 0 when not measured
  int64 disk_size_before = 15;
  int64 disk_size_after = 16;

  // SQL statement (statement rows) or script text (EXEC rows)
  string sql_query = 17;

  // Error message for FAILED rows, or the reason for UNSUPPORTED rows
  string error_message = 18;

  // True when a commit ref was requested on a backend without commits and
  // the branch head was used instead.
  bool commit_ref_fallback = 19;

  // Thread ID for multi-threaded benchmark runs
  int32 thread_id = 20;

  // Number of active branches at the time of this operation
  int32 branch_count = 21;

  // Step ID within the macrobenchmark workflow (-1 if not in a step)
  int32 step_id = 22;

  // Wall-clock start/end (Unix epoch seconds)
  double start_time = 23;
  double end_time = 24;

  // Async mode: time spent waiting for a free pool connection before the
  // operation started (seconds). Not included in latency.
  double pool_wait_time = 25;
}

enum OpType {
  UNSPECIFIED = 0;

  // Git-like verbs
  BRANCH = 1;
  COMMIT = 2;
  DIFF = 3;
  LOG = 4;
  MERGE = 5;
  REBASE = 6;
  REVERT = 7;
  RESET = 8;
  DELETE = 9;

  // exec(): connection switch, per-statement rows, and the summary row
  CONNECT = 10;
  READ = 11;
  INSERT = 12;
  UPDATE = 13;
  DDL = 14;
  EXEC = 15;

  // Driver-side waits (e.g. backoff on API rate limits)
  API_RETRY_WAIT = 16;
}

enum OpStatus {
  OK = 0;
  UNSUPPORTED = 1;
  FAILED = 2;
}
